<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三国杀 · WebUI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="title">三国杀</span>
      <span id="turn-info" class="muted"></span>
    </div>
    <div class="top-right">
      <span id="deck-info" class="muted"></span>
      <span id="status" class="status">未连接</span>
    </div>
  </header>

  <main>
    <section id="lobby" hidden>
      <h2>等待其他玩家加入…</h2>
      <ul id="lobby-list"></ul>
      <p class="hint">人齐后游戏自动开始。若你之前断线，刷新页面即可自动重连取回控制权。</p>
    </section>

    <section id="game" hidden>
      <div id="battlefield"></div>
      <div id="logs"></div>
      <div id="actions"></div>
      <div id="myhand"></div>
    </section>
  </main>

  <div id="join-overlay" class="overlay" hidden>
    <div class="modal">
      <h2>加入房间</h2>
      <input id="name-input" placeholder="输入你的名字" maxlength="20">
      <button id="join-btn" class="primary">加入</button>
      <p class="hint">输入名字后加入对局。若你之前掉线过，请输入同样的名字即可自动重连。</p>
    </div>
  </div>

  <div id="gameover-overlay" class="overlay" hidden>
    <div class="modal">
      <h2 id="gameover-title"></h2>
      <p id="gameover-message" class="muted"></p>
      <button id="confirm-next" class="primary">确认下一局</button>
      <p class="muted" id="confirm-status"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
